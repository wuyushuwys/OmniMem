wandb_key: ${oc.env:WANDB_KEY}
wandb_project: ${oc.env:WANDB_PROJ}
wandb_host: ${oc.env:WANDB_HOST,null}

s3_bucket: ${oc.env:S3_BUCKET,null}
s3_dir: ${oc.env:S3_DIR,null}

output_dir: "outputs"
same_step_across_blocks: true
timestep_shift: 5
timestep_sample_method: uniform


#nsa related
nsa_kwargs:
  pool_h: 15
  pool_w: 2
  enable_nsa: true
  num_selected_blocks: 16
  exclude_window_chunks: 3
  group_q_size: 15
  progressive_exclude: true

# upload or local backup files
upload: true

frame_per_block: 3
sink_size: 
  kv: null
  kv_cmp: null
window_size:
  kv: 3
  kv_cmp: null

# streaming training
streaming_chunk_size: 21
streaming_max_length: 237
streaming_min_new_frame: 18
train_first_chunk: true

null_prompt: '色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走'

sharding_strategy: fully_shard
gradient_accumulation_steps: 1
num_workers: 8
pin_memory: true

ema_model: true
ema_decay: 0.99
ema_start_step: 200

torch_compile: true
max_grad_norm: 1

lr_warmup_steps: 0
lr_scheduler: constant_with_warmup

critic_loss_type: flow

max_distillation_steps: 4
dfake_gen_update_ratio: 5

real_guidance_scale: 3

learning_rate: 2.0e-06
adam_beta1: 0.0
adam_beta2: 0.999
adam_weight_decay: 0.01

critic_learning_rate: 4.0e-07
critic_adam_beta1: 0.0
critic_adam_beta2: 0.999
critic_adam_weight_decay: 0.01

real_model_path: wan_models/Wan2.1-T2V-14B
fake_model_path: wan_models/Wan2.1-T2V-1.3B

model_path: outputs/nsa-sf-swa-b2x15-top16-ew3-qg15
# resume_ckpt_path: outputs/<some_run>/checkpoints
vae_path: wan_models/vae-2.1/vae
text_encoder_path: wan_models/Wan2.1-T2V-1.3B/models_t5_umt5-xxl-enc-bf16.pth
tokenizer_path: wan_models/Wan2.1-T2V-1.3B/google/umt5-xxl


scheduler_path: configs/schedulers/rectified_flow.json

dataset_type: text_dataset
train_data:
  batch_size: 1
  prompt_path: configs/prompts/vidprom_filtered_extended.txt
  switch_prompt_path: configs/prompts/vidprom_filtered_extended.txt

validation_data:
  prompt_file:
    - configs/prompts/demo.txt
  num_inference_steps: 4
  guidance_scale: 1
  fps: 16
  num_frames: 237
  width: 832
  height: 480
  n_rows: 1


enable_kv_evict: true
enable_chunk_per_head_cache: true
kv_cache_lru_max_size: 7  # 0 to disable LRU offload entirely


max_train_steps: 600
checkpointing_steps: 50

log_steps: 10

validation_steps: 50

global_seed: 42

gradient_checkpointing: true

latents_shape: [16, 21, 60, 104]


slice_last_frames: 21

switch_mode: random_choice
switch_choices:
- 21
- 39
- 57
- 75
- 93
- 111
- 129
- 147
- 165
- 183
- 201

last_step_only: false
